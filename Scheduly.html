<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Scheduly — Smart Timetable Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  
/* ══════════════════════════════════════════
   SCHEDULY — Design System
   Aesthetic: Refined editorial + utilitarian grid
   Fonts: DM Sans (UI) + DM Mono (times/data)
══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ff-ui:'DM Sans',sans-serif;
  --ff-mono:'DM Mono',monospace;
  /* Light */
  --bg:#F8F7F4;
  --surface:#FFFFFF;
  --surface2:#F2F1EE;
  --surface3:#E8E6E1;
  --text:#18181A;
  --text2:#5C5B60;
  --text3:#9C9BA0;
  --border:rgba(0,0,0,0.09);
  --border2:rgba(0,0,0,0.18);
  --accent:#2563EB;
  --accent-dim:#EEF3FD;
  --accent-text:#1D4ED8;
  --green:#16A34A;
  --green-dim:#DCFCE7;
  --red:#DC2626;
  --red-dim:#FEE2E2;
  --amber:#D97706;
  --amber-dim:#FEF3C7;
  --weekend-col:#FAF9F7;
  --weekend-head:#F0EFE9;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:0 12px 40px rgba(0,0,0,.14);
  --radius:10px;
  --radius-lg:14px;
  --radius-xl:20px;
}
[data-theme="dark"]{
  --bg:#111113;
  --surface:#1C1C1F;
  --surface2:#252528;
  --surface3:#2E2E32;
  --text:#F2F1EE;
  --text2:#A09FA8;
  --text3:#5C5B62;
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.16);
  --accent:#3B82F6;
  --accent-dim:#172554;
  --accent-text:#93C5FD;
  --green:#22C55E;
  --green-dim:#052E16;
  --red:#F87171;
  --red-dim:#450A0A;
  --amber:#FCD34D;
  --amber-dim:#451A03;
  --weekend-col:#191919;
  --weekend-head:#202020;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);
  --shadow:0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}

html{scroll-behavior:smooth}
body{font-family:var(--ff-ui);background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding:0 1.5rem;
  display:flex;align-items:center;gap:12px;height:56px;
}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.logo-mark{
  width:32px;height:32px;border-radius:9px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;
}
.logo-name{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.03em}
.logo-name span{color:var(--accent)}
.topbar-gap{flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}

/* Theme toggle */
.theme-pill{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px 5px 8px;
  border:1px solid var(--border2);border-radius:99px;
  background:var(--surface2);cursor:pointer;user-select:none;
  font-size:12px;font-weight:500;color:var(--text2);
  transition:background .15s;
}
.theme-pill:hover{background:var(--surface3)}
.theme-pill i{font-size:14px}
.theme-pill .track{
  width:30px;height:17px;border-radius:99px;
  background:var(--surface3);position:relative;
  transition:background .2s;margin-left:2px;
}
[data-theme="dark"] .theme-pill .track{background:var(--accent)}
.theme-pill .thumb{
  position:absolute;top:2.5px;left:2.5px;
  width:12px;height:12px;border-radius:50%;
  background:#fff;transition:transform .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
[data-theme="dark"] .theme-pill .thumb{transform:translateX(13px)}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--radius);
  font-family:var(--ff-ui);font-size:13px;font-weight:500;
  border:1px solid var(--border2);background:var(--surface);color:var(--text);
  cursor:pointer;transition:all .15s;white-space:nowrap;text-decoration:none;
}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn.success{color:var(--green);border-color:currentColor;background:transparent}
.btn.success:hover{background:var(--green-dim)}
.btn.danger{color:var(--red);border-color:currentColor;background:transparent}
.btn.danger:hover{background:var(--red-dim)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.icon{padding:7px;gap:0}
.btn i{font-size:15px}
.btn.sm i{font-size:13px}

/* ── Layout ── */
.app{max-width:1260px;margin:0 auto;padding:1.25rem 1.5rem 3rem}
.main-tabs{
  display:flex;gap:2px;background:var(--surface2);
  border-radius:var(--radius-lg);padding:3px;
  border:1px solid var(--border);
  margin-bottom:1.25rem;width:fit-content;
}
.tab-btn{
  padding:7px 18px;border:none;border-radius:10px;
  background:transparent;color:var(--text2);
  font-size:13px;font-weight:500;cursor:pointer;
  font-family:var(--ff-ui);transition:all .15s;
  display:flex;align-items:center;gap:6px;
}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.tab-panel{display:none}.tab-panel.active{display:block}

.builder-layout{display:grid;grid-template-columns:248px 1fr;gap:16px;align-items:start}
@media(max-width:720px){.builder-layout{grid-template-columns:1fr}}
.sidebar{display:flex;flex-direction:column;gap:12px}

/* ── Cards ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px;
  box-shadow:var(--shadow-sm);transition:background .25s;
}
.card-label{
  font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text3);
  margin-bottom:12px;display:flex;align-items:center;gap:6px;
}

/* ── Form elements ── */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{font-size:12px;font-weight:500;color:var(--text2)}
.row-inline{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.row-inline label{font-size:12px;color:var(--text2);width:36px;flex-shrink:0}
input[type=text],input[type=email],input[type=password],input[type=time],select,textarea{
  width:100%;font-size:13px;padding:7px 10px;
  border:1px solid var(--border2);border-radius:var(--radius);
  background:var(--surface);color:var(--text);font-family:var(--ff-ui);
  outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);
}
input[type=color]{
  width:32px;height:32px;border:1px solid var(--border2);
  border-radius:var(--radius);padding:2px;background:var(--surface);
  cursor:pointer;flex-shrink:0;
}
textarea{resize:vertical;min-height:56px}

/* ── Chips ── */
.chip-list{display:flex;flex-direction:column;gap:4px;max-height:140px;overflow-y:auto}
.chip{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 9px;border-radius:var(--radius);font-size:13px;
  border:1px solid var(--border);background:var(--surface2);
}
.chip-dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px;flex-shrink:0}
.chip-rm{
  background:none;border:none;cursor:pointer;color:var(--text3);
  font-size:15px;line-height:1;padding:0 3px;font-family:inherit;
  transition:color .1s;
}
.chip-rm:hover{color:var(--red)}
.empty-hint{color:var(--text3);font-size:12px;text-align:center;padding:12px 0}

/* ── Day toggles ── */
.day-row{
  display:flex;align-items:center;gap:9px;
  padding:5px 0;cursor:pointer;user-select:none;
  font-size:13px;font-weight:400;color:var(--text);
}
.day-row input[type=checkbox]{
  width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;
}
.weekend-tag{
  font-size:10px;font-weight:600;color:var(--text3);
  background:var(--surface3);border-radius:99px;padding:1px 6px;
}

/* ── Legend ── */
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.legend-chip{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}

/* ── Timetable grid ── */
.tt-scroll{overflow-x:auto;border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:440px}
th,td{border:1px solid var(--border);padding:0;text-align:center}
th{
  background:var(--surface2);font-weight:600;color:var(--text2);
  padding:9px 6px;font-size:10px;font-family:var(--ff-ui);
  letter-spacing:.06em;text-transform:uppercase;
  position:sticky;top:0;z-index:2;
}
th.wknd{background:var(--weekend-head);color:var(--text3)}

/* Time pill — DM Mono */
td.time-col{
  width:70px;padding:3px 6px;
  background:var(--surface2);vertical-align:middle;
  border-right:1px solid var(--border2);
}
.t-pill{
  display:inline-flex;flex-direction:column;align-items:center;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:99px;padding:2px 9px;min-width:52px;
  font-family:var(--ff-mono);line-height:1.3;
}
.t-pill .th{font-size:11px;font-weight:500;color:var(--text)}
.t-pill .tm{font-size:9px;color:var(--text3);font-weight:400}

td.slot{cursor:pointer;height:40px;position:relative;vertical-align:top;transition:background .1s}
td.slot.wknd-slot{background:var(--weekend-col)}
td.slot:hover{background:var(--accent-dim)!important}
td.slot.conflict-slot{background:color-mix(in srgb,var(--amber) 8%,transparent)!important}
.session-block{
  position:absolute;inset:2px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:600;padding:2px 5px;
  text-align:center;line-height:1.2;cursor:pointer;
  overflow:hidden;word-break:break-word;
  transition:opacity .1s;
}
.session-block:hover{opacity:.85}
.conflict-icon{position:absolute;top:2px;right:3px;font-size:9px}

/* Right-click context menu */
.ctx-menu{
  position:fixed;z-index:300;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);
  padding:4px;min-width:150px;
  animation:fadeIn .1s ease;
}
.ctx-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;border-radius:7px;font-size:13px;
  cursor:pointer;color:var(--text);transition:background .1s;
}
.ctx-item:hover{background:var(--surface2)}
.ctx-item.danger{color:var(--red)}
.ctx-item i{font-size:14px;color:var(--text3)}
.ctx-item.danger i{color:var(--red)}
@keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* ── Auth overlay ── */
.auth-overlay{
  position:fixed;inset:0;z-index:400;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;
}
.auth-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius-xl);padding:32px;
  width:100%;max-width:380px;
  box-shadow:var(--shadow-lg);
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.auth-logo .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.auth-logo .name{font-size:20px;font-weight:700;letter-spacing:-.03em}
.auth-logo .name span{color:var(--accent)}
.auth-sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.auth-tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:10px;border:1px solid var(--border);margin-bottom:20px}
.auth-tab{flex:1;padding:7px;border:none;background:transparent;font-family:var(--ff-ui);font-size:13px;font-weight:500;color:var(--text2);border-radius:8px;cursor:pointer;transition:all .15s}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.auth-error{color:var(--red);font-size:12px;background:var(--red-dim);padding:8px 12px;border-radius:var(--radius);margin-bottom:10px;display:none}
.auth-error.show{display:block}

/* ── Modals ── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.52);
  display:flex;align-items:center;justify-content:center;
  z-index:200;padding:1rem;
  backdrop-filter:blur(4px);
}
.modal{
  background:var(--surface);border-radius:var(--radius-xl);
  border:1px solid var(--border2);padding:24px;
  width:100%;max-width:380px;
  display:flex;flex-direction:column;gap:14px;
  box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;
  animation:slideUp .2s ease;
}
.modal-h{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-h i{color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.cond{display:none}.cond.on{display:flex;flex-direction:column;gap:5px}

/* ── Prog badges ── */
.prog-badge{
  display:inline-flex;align-items:center;
  padding:2px 9px;border-radius:99px;
  font-size:11px;font-weight:600;letter-spacing:.02em;
}
.pb-Regular{background:#EEF3FD;color:#1D4ED8}
.pb-Evening{background:#FEF3C7;color:#92400E}
.pb-Weekend{background:#DCFCE7;color:#166534}
.pb-UnderGraduate{background:#F3E8FF;color:#5B21B6}
.pb-Graduate{background:#FCE7F3;color:#831843}
.pb-Diploma{background:#FFF7ED;color:#C2410C}
.pb-Other{background:var(--surface3);color:var(--text2)}
[data-theme="dark"] .pb-Regular{background:#172554;color:#93C5FD}
[data-theme="dark"] .pb-Evening{background:#451A03;color:#FCD34D}
[data-theme="dark"] .pb-Weekend{background:#052E16;color:#86EFAC}
[data-theme="dark"] .pb-UnderGraduate{background:#2E1065;color:#C4B5FD}
[data-theme="dark"] .pb-Graduate{background:#500724;color:#FBCFE8}
[data-theme="dark"] .pb-Diploma{background:#431407;color:#FDBA74}
[data-theme="dark"] .pb-Other{background:var(--surface3);color:var(--text2)}

/* ── Saved list ── */
.search-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.search-bar input,.search-bar select{flex:1;min-width:140px}
.section-head{
  font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text3);
  margin-bottom:8px;display:flex;align-items:center;gap:8px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
}
.saved-section{margin-bottom:20px}
.tt-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--surface);
  margin-bottom:6px;transition:border-color .15s,box-shadow .15s;
}
.tt-row:hover{border-color:var(--border2);box-shadow:var(--shadow-sm)}
.tt-row-info{flex:1;min-width:0}
.tt-row-name{font-size:14px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-row-meta{font-size:12px;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tt-row-actions{display:flex;gap:6px;flex-shrink:0}
.no-results{text-align:center;padding:32px 0;color:var(--text3)}
.no-results i{font-size:32px;display:block;margin-bottom:8px}

/* ── Conflict card ── */
.alert-card{border-color:var(--amber)!important}
.alert-card .card-label{color:var(--amber)!important}

/* ── Auth status bar ── */
.user-pill{
  display:flex;align-items:center;gap:7px;
  padding:5px 10px;border:1px solid var(--border);
  border-radius:99px;font-size:12px;font-weight:500;
  background:var(--surface2);color:var(--text2);cursor:default;
}
.user-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}

/* ── Toast ── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);
  padding:10px 20px;border-radius:99px;
  font-size:13px;font-weight:500;
  box-shadow:var(--shadow-lg);z-index:500;
  animation:toastIn .25s ease;pointer-events:none;
  white-space:nowrap;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── Print ── */
@media print{
  .topbar,.sidebar,.main-tabs,.hdr-actions,.modal-bg,.ctx-menu,.toast,.auth-overlay{display:none!important}
  body{background:#fff!important}
  [data-theme="dark"]{--surface:#fff;--surface2:#f5f5f5;--text:#111;--text2:#555;--text3:#999;--border:rgba(0,0,0,.15);--border2:rgba(0,0,0,.25);--bg:#fff}
  .builder-layout{grid-template-columns:1fr!important}
  .card{border:none;box-shadow:none;padding:0}
  .tt-scroll{overflow:visible}
  table{font-size:10px}
  th,td{border:0.5px solid #ccc!important}
  td.slot{height:26px!important}
  .session-block{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .t-pill{background:#f0f0f0!important;border-color:#ddd!important}
  .t-pill .th{color:#222!important}
  .t-pill .tm{color:#888!important}
  th{background:#f5f5f5!important;color:#444!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<!-- ══ TOPBAR ══ -->
<header class="topbar">
  <a href="#" class="logo">
    <div class="logo-mark"><i class="ti ti-calendar-event"></i></div>
    <span class="logo-name">Sched<span>uly</span></span>
  </a>
  <div class="topbar-gap"></div>
  <div class="topbar-actions" id="topbarActions">
    <button class="btn sm success" onclick="window.print()"><i class="ti ti-printer"></i>Print</button>
    <button class="btn sm" onclick="exportCSV()"><i class="ti ti-download"></i>CSV</button>
    <div class="theme-pill" onclick="toggleTheme()">
      <i class="ti ti-moon" id="themeIcon"></i>
      <div class="track"><div class="thumb"></div></div>
    </div>
    <div id="authArea"></div>
  </div>
</header>

<!-- ══ APP ══ -->
<div class="app">
  <div class="main-tabs">
    <button class="tab-btn active" onclick="switchTab('builder',this)"><i class="ti ti-layout-grid"></i>Builder</button>
    <button class="tab-btn" onclick="switchTab('saved',this)"><i class="ti ti-archive"></i>Saved Timetables</button>
  </div>

  <!-- ══ BUILDER ══ -->
  <div id="tab-builder" class="tab-panel active">
    <div class="builder-layout">
      <div class="sidebar">

        <!-- Classes / Courses -->
        <div class="card">
          <div class="card-label"><i class="ti ti-school"></i>Classes / Courses</div>
          <div class="row-inline" style="margin-bottom:7px">
            <input type="text" id="classInput" placeholder="e.g. CS101" style="flex:1" onkeydown="if(event.key==='Enter')addClass()"/>
          </div>
          <div style="display:flex;gap:7px;margin-bottom:9px">
            <input type="color" id="classColor" value="#2563EB" title="Pick colour"/>
            <button class="btn primary" onclick="addClass()" style="flex:1;justify-content:center"><i class="ti ti-plus"></i>Add</button>
          </div>
          <div class="chip-list" id="classList"><div class="empty-hint">No courses added yet</div></div>
        </div>

        <!-- Days -->
        <div class="card">
          <div class="card-label"><i class="ti ti-calendar-week"></i>Days of the Week</div>
          <div id="dayToggles"></div>
        </div>

        <!-- Times -->

// ── State ──
const ALL_DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const WKND=new Set(['Saturday','Sunday']);
let classes=[],slots=[],sessions={},activeDays=[...ALL_DAYS.slice(0,5)];
let assignTarget=null,ctxTarget=null,viewingId=null;
let allSaved=[];

// ── Day toggles ──
function initDays(){
  document.getElementById('dayToggles').innerHTML=ALL_DAYS.map(d=>`
    <label class="day-row">
      <input type="checkbox" id="day_${d}" ${activeDays.includes(d)?'checked':''} onchange="toggleDay('${d}',this.checked)"/>
      ${d}${WKND.has(d)?'<span class="weekend-tag">Weekend</span>':''}
    </label>`).join('');
}
function toggleDay(day,checked){
  if(checked&&!activeDays.includes(day)) activeDays.push(day);
  else activeDays=activeDays.filter(d=>d!==day);
  activeDays.sort((a,b)=>ALL_DAYS.indexOf(a)-ALL_DAYS.indexOf(b));
  if(!checked) for(const k of Object.keys(sessions)) if(k.startsWith(day+'::')) delete sessions[k];
  renderTT();
}

// ── Slots ──
function applySlots(){
  const s=document.getElementById('slotStart').value,e=document.getElementById('slotEnd').value;
  const i=parseInt(document.getElementById('slotInterval').value);
  if(!s||!e||s>=e){toast('Set a valid time range.');return;}
  slots=timeRange(s,e,i); sessions={}; renderTT();
}
function timeRange(s,e,i){
  const t=[];let[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let c=sh*60+sm,l=eh*60+em;
  while(c<l){const h=Math.floor(c/60),m=c%60;t.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);c+=i;}
  return t;
}

// ── Classes ──
function addClass(){
  const name=document.getElementById('classInput').value.trim();if(!name)return;
  const color=document.getElementById('classColor').value;
  if(classes.find(c=>c.name===name)){toast('Course already exists.');return;}
  classes.push({name,color});document.getElementById('classInput').value='';
  renderChips();renderLegend();renderTT();
}
function removeClass(i){
  const cls=classes[i];classes.splice(i,1);
  for(const k of Object.keys(sessions)) if(sessions[k]?.cls===cls.name) delete sessions[k];
  renderChips();renderLegend();renderTT();
}
function renderChips(){
  const el=document.getElementById('classList');
  if(!classes.length){el.innerHTML='<div class="empty-hint">No courses added yet</div>';return;}
  el.innerHTML=classes.map((c,i)=>`
    <div class="chip"><span><span class="chip-dot" style="background:${c.color}"></span>${c.name}</span>
    <button class="chip-rm" onclick="removeClass(${i})">×</button></div>`).join('');
}
function renderLegend(){
  const el=document.getElementById('legend');
  if(!classes.length){el.innerHTML='<span class="empty-hint" style="padding:4px 0">Add a course to see colours</span>';return;}
  el.innerHTML=classes.map(c=>`<span class="legend-chip"><span class="legend-dot" style="background:${c.color}"></span>${c.name}</span>`).join('');
}

// ── Time pill ──
function tpill(t){
  const[h,m]=t.split(':');const hr=parseInt(h),ap=hr>=12?'PM':'AM',h12=hr%12||12;
  return`<div class="t-pill"><span class="th">${h12}${m==='00'?'':':'+m}</span><span class="tm">${ap}</span></div>`;
}

// ── Conflicts ──
const sk=(day,t)=>`${day}::${t}`;
function conflicts(){
  const c={};
  for(const k of Object.keys(sessions)){
    const s=sessions[k];if(!s)continue;
    const[day,t]=k.split('::'),si=slots.indexOf(t);
    for(let d=1;d<s.duration;d++){const ok=sk(day,slots[si+d]);if(sessions[ok])c[ok]=true;}
  }return c;
}

// ── Render timetable ──
function hasSessions(){return Object.keys(sessions).some(k=>sessions[k]);}
function renderTT(){
  const tt=document.getElementById('tt');
  document.getElementById('saveTTBtn').style.display=hasSessions()&&currentUser?'flex':'none';
  if(!slots.length||!activeDays.length){
    tt.innerHTML=`<tr><td style="padding:32px;color:var(--text3);font-size:13px;text-align:center" colspan="${activeDays.length+1}">${!activeDays.length?'Enable at least one day.':'Set times and click Apply.'}</td></tr>`;
    renderConflict();return;
  }
  const C=conflicts(),occ=new Set();
  for(const k of Object.keys(sessions)){
    const s=sessions[k];if(!s)continue;
    const[day,t]=k.split('::'),si=slots.indexOf(t);
    for(let d=1;d<s.duration;d++) occ.add(sk(day,slots[si+d]));
  }
  let html='<tr><th style="width:70px"></th>'+activeDays.map(d=>`<th${WKND.has(d)?' class="wknd"':''}>${d}</th>`).join('')+'</tr>';
  for(let si=0;si<slots.length;si++){
    html+=`<tr><td class="time-col">${tpill(slots[si])}</td>`;
    for(const day of activeDays){
      const k=sk(day,slots[si]),iw=WKND.has(day);
      if(occ.has(k)){html+=`<td class="slot${iw?' wknd-slot':''}" style="cursor:default"></td>`;continue;}
      const s=sessions[k],isC=C[k];
      if(s){
        const cls=classes.find(c=>c.name===s.cls),bg=cls?cls.color:'#888',h=s.duration*40-4;
        html+=`<td class="slot${iw?' wknd-slot':''}${isC?' conflict-slot':''}"
          onclick="openAssign('${day}','${slots[si]}')"
          oncontextmenu="openCtx(event,'${day}','${slots[si]}')">
          <div class="session-block" style="background:${bg}1A;border:1.5px solid ${bg};color:${bg};height:${h}px">
            ${s.cls}${isC?'<span class="conflict-icon">⚠</span>':''}
          </div></td>`;
      }else{
        html+=`<td class="slot${iw?' wknd-slot':''}${isC?' conflict-slot':''}" onclick="openAssign('${day}','${slots[si]}')"></td>`;
      }
    }html+='</tr>';
  }
  tt.innerHTML=html;renderConflict();
}
function renderConflict(){
  const C=conflicts(),p=document.getElementById('conflictPanel'),n=Object.keys(C).length;
  if(!n){p.innerHTML='';return;}
  p.innerHTML=`<div class="card alert-card">
    <div class="card-label"><i class="ti ti-alert-triangle"></i>Conflicts (${n})</div>
    <div style="font-size:12px;color:var(--text2)">${n} slot${n>1?'s':''} double-booked. Fix by clicking the highlighted slot.</div>
  </div>`;
}

// ── Assign modal ──
function openAssign(day,t){
  if(!classes.length){toast('Add a course first.');return;}
  assignTarget={day,t};
  const k=sk(day,t),ex=sessions[k];
  document.getElementById('assignTitle').textContent=ex?`Edit: ${day} ${t}`:`Assign: ${day} ${t}`;
  const sel=document.getElementById('aClass');
  sel.innerHTML=classes.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
  if(ex){sel.value=ex.cls;document.getElementById('aDur').value=ex.duration;}
  else document.getElementById('aDur').value=1;
  document.getElementById('assignBg').style.display='flex';
}
function closeAssign(){document.getElementById('assignBg').style.display='none';assignTarget=null;}
function assignSession(){
  if(!assignTarget)return;
  const{day,t}=assignTarget,cls=document.getElementById('aClass').value;
  const dur=parseInt(document.getElementById('aDur').value),k=sk(day,t),si=slots.indexOf(t);
  if(si+dur>slots.length){toast('Duration exceeds available slots.');return;}
  const old=sessions[k];
  if(old) for(let d=1;d<old.duration;d++) delete sessions[sk(day,slots[si+d])];
  sessions[k]={cls,duration:dur};
  closeAssign();renderTT();
}

// ── Context menu (right-click / long-press) ──
function openCtx(e,day,t){
  e.preventDefault();e.stopPropagation();
  ctxTarget={day,t};
  const m=document.getElementById('ctxMenu');
  m.style.display='block';
  m.style.left=Math.min(e.clientX,window.innerWidth-160)+'px';
  m.style.top=Math.min(e.clientY,window.innerHeight-90)+'px';
}
function closeCtx(){document.getElementById('ctxMenu').style.display='none';ctxTarget=null;}
function ctxEdit(){if(!ctxTarget)return;closeCtx();openAssign(ctxTarget.day,ctxTarget.t);}
function ctxUnassign(){
  if(!ctxTarget)return;
  const k=sk(ctxTarget.day,ctxTarget.t),s=sessions[k];
  if(s){const si=slots.indexOf(ctxTarget.t);for(let d=1;d<s.duration;d++) delete sessions[sk(ctxTarget.day,slots[si+d])];delete sessions[k];}
  closeCtx();renderTT();toast('Slot unassigned.');
}
document.addEventListener('click',e=>{if(!document.getElementById('ctxMenu').contains(e.target)) closeCtx();});

// ── Clear / Export ──
function clearAll(){if(!confirm('Clear the entire timetable?'))return;sessions={};renderTT();}
function exportCSV(){
  if(!slots.length){toast('Build a timetable first.');return;}
  const occ=new Set();
  for(const k of Object.keys(sessions)){const s=sessions[k];if(!s)continue;const[day,t]=k.split('::'),si=slots.indexOf(t);for(let d=1;d<s.duration;d++) occ.add(sk(day,slots[si+d]));}
  let csv='Time,'+activeDays.join(',')+'\n';
  for(const t of slots) csv+=t+','+activeDays.map(d=>{const k=sk(d,t);if(occ.has(k))return'"(cont.)"';const s=sessions[k];return s?`"${s.cls}"`:''}).join(',')+'\n';
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');
  a.href=url;a.download='scheduly-timetable.csv';a.click();URL.revokeObjectURL(url);
}

async function confirmSave(){
  const course=document.getElementById('sCourse').value.trim();

  let detail='';

  const payload={
    created_by:currentUser.id,
    course,prog_type:progType,detail,
    notes:document.getElementById('sNotes').value.trim(),
    active_days:activeDays,slots,
    classes:JSON.parse(JSON.stringify(classes)),
    sessions:JSON.parse(JSON.stringify(sessions))
  };
  const{error}=await sb.from('timetables').insert([payload]);
  if(error){toast('Save failed: '+error.message);return;}
  closeSave();toast('Timetable saved!');
  renderSaved();
}

// ── Saved timetables ──
const PROG_ORDER=['Regular','Evening','Weekend','Under-Graduate','Graduate','Diploma','Other'];
function pbClass(pt){return 'pb-'+pt.replace(/[^a-zA-Z]/g,'');}

async function renderSaved(){
  const q=document.getElementById('searchQ')?.value.trim().toLowerCase()||'';
  const fp=document.getElementById('searchProg')?.value||'';
  const el=document.getElementById('savedList');
  el.innerHTML='<div class="no-results"><i class="ti ti-loader"></i>Loading…</div>';

  let query=sb.from('timetables').select('*').order('created_at',{ascending:false});
  if(fp) query=query.eq('prog_type',fp);
  const{data,error}=await query;
  if(error){el.innerHTML='<div class="no-results">Error loading timetables.</div>';return;}

  let list=data||[];
  if(q) list=list.filter(r=>r.course.toLowerCase().includes(q)||(r.detail||'').toLowerCase().includes(q));
  allSaved=list;

  if(!list.length){el.innerHTML='<div class="no-results"><i class="ti ti-calendar-off"></i>No timetables found.</div>';return;}

  const groups={};
  for(const r of list){const g=r.prog_type||'Other';if(!groups[g])groups[g]=[];groups[g].push(r);}
  let html='';
  for(const cat of PROG_ORDER){
    if(!groups[cat])continue;
    html+=`<div class="saved-section">
      <div class="section-head"><span class="prog-badge ${pbClass(cat)}">${cat}</span>${groups[cat].length} timetable${groups[cat].length>1?'s':''}</div>`;
    for(const r of groups[cat]){
      const canEdit=currentUser&&(currentUser.id===r.created_by);
      html+=`<div class="tt-row">
        <div class="tt-row-info">
          <div class="tt-row-name">${r.course}</div>
          <div class="tt-row-meta">
            <span class="prog-badge ${pbClass(cat)}" style="font-size:10px">${r.prog_type}</span>
            ${r.detail?`<span>${r.detail}</span>`:''}
            <span>${new Date(r.created_at).toLocaleDateString()}</span>
            ${r.notes?`<span title="${r.notes}"><i class="ti ti-notes" style="font-size:12px"></i></span>`:''}
          </div>
        </div>
        <div class="tt-row-actions">
          ${canEdit?`<button class="btn sm ghost" onclick="loadRecord('${r.id}')"><i class="ti ti-pencil"></i>Load</button>`:''}
          <button class="btn sm" onclick="viewRecord('${r.id}')"><i class="ti ti-eye"></i>View</button>
        </div>
      </div>`;
    }html+='</div>';
  }
  el.innerHTML=html;
}
function clearSearch(){document.getElementById('searchQ').value='';document.getElementById('searchProg').value='';renderSaved();}

// ── View modal ──
function viewRecord(id){
  const r=allSaved.find(x=>x.id===id);if(!r)return;
  viewingId=id;
  document.getElementById('viewTitle').textContent=r.course;
  const cat=r.prog_type||'Other';
  document.getElementById('viewMeta').innerHTML=`
    <span class="prog-badge ${pbClass(cat)}">${r.prog_type}</span>
    ${r.detail?`<span>${r.detail}</span>`:''}
    <span>${new Date(r.created_at).toLocaleString()}</span>
    ${r.notes?`<span>${r.notes}</span>`:''}`;
  // Show/hide delete btn based on ownership
  const canEdit=currentUser&&(currentUser.id===r.created_by);
  document.getElementById('viewDelBtn').style.display=canEdit?'inline-flex':'none';
  document.getElementById('viewLoadBtn').style.display=canEdit?'inline-flex':'none';
  // Mini table
  const occ=new Set();
  const sess=r.sessions||{};
  for(const k of Object.keys(sess)){const s=sess[k];if(!s)continue;const[day,t]=k.split('::'),si=r.slots.indexOf(t);for(let d=1;d<s.duration;d++) occ.add(`${day}::${r.slots[si+d]}`);}
  let html='<tr><th style="width:60px"></th>'+r.active_days.map(d=>`<th${WKND.has(d)?' class="wknd"':''}>${d}</th>`).join('')+'</tr>';
  for(let si=0;si<r.slots.length;si++){
    const t=r.slots[si];
    html+=`<tr><td class="time-col">${tpill(t)}</td>`;
    for(const day of r.active_days){
      const k=`${day}::${t}`,iw=WKND.has(day);
      if(occ.has(k)){html+=`<td class="slot${iw?' wknd-slot':''}" style="cursor:default"></td>`;continue;}
      const s=sess[k];
      if(s){const cls=(r.classes||[]).find(c=>c.name===s.cls),bg=cls?cls.color:'#888',h=s.duration*40-4;
        html+=`<td class="slot${iw?' wknd-slot':''}"><div class="session-block" style="background:${bg}1A;border:1.5px solid ${bg};color:${bg};height:${h}px">${s.cls}</div></td>`;
      }else html+=`<td class="slot${iw?' wknd-slot':''}" style="cursor:default"></td>`;
    }html+='</tr>';
  }
  document.getElementById('viewTable').innerHTML=html;
  document.getElementById('viewBg').style.display='flex';
}
function closeView(){document.getElementById('viewBg').style.display='none';viewingId=null;}
async function deleteViewed(){
  if(!viewingId||!confirm('Delete this timetable permanently?'))return;
  const{error}=await sb.from('timetables').delete().eq('id',viewingId);
  if(error){toast('Delete failed.');return;}
  closeView();toast('Deleted.');renderSaved();
}
function loadFromView(){
  if(!viewingId)return;
  loadRecord(viewingId);closeView();
}
function loadRecord(id){
  const r=allSaved.find(x=>x.id===id);if(!r)return;
  if(!confirm(`Load "${r.course}"? This replaces your current timetable.`))return;
  classes=JSON.parse(JSON.stringify(r.classes||[]));
  activeDays=[...r.active_days];
  slots=[...r.slots];
  sessions=JSON.parse(JSON.stringify(r.sessions||{}));
  initDays();renderChips();renderLegend();renderTT();
  switchTab('builder',document.querySelector('.tab-btn'));
  toast('Timetable loaded.');
}

// ── Real-time subscription ──
sb.channel('timetables-changes')
  .on('postgres_changes',{event:'*',schema:'public',table:'timetables'},()=>{
    if(document.getElementById('tab-saved').classList.contains('active')) renderSaved();
  }).subscribe();

// ── Toast ──
function toast(msg,dur=2800){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),dur);
}

// ── Init ──
initDays();
applySlots();
initAuth();
renderSaved();
</script>
